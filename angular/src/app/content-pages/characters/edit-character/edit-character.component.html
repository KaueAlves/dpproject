<div class="bg-zinc-800 text-white rounded-lg p-6 w-full ">
    <h1 class="text-2xl font-bold text-center mb-3">Ficha de Personagem de D&D</h1>

    <div class="grid grid-rows-1 grid-flow-col gap-4">
        <!-- Informações do Jogador -->
        <div class=" mb-3">
            <label for="player" class="block font-semibold mb-1">Nome do Jogador</label>
            <input type="text" id="player" placeholder="Nome do Jogador"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded">
        </div>

        <!-- Nome e Informações Básicas -->
        <div class="mb-3">
            <label for="name" class="block font-semibold mb-1">Nome do Personagem</label>
            <input type="text" id="name" placeholder="Nome do Personagem"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded">
        </div>
        <div class=" mb-3">
            <label for="class" class="block font-semibold mb-1">Classe</label>
            <input type="text" id="class" placeholder="Ex: Ladino"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded">
        </div>
        <div class=" mb-3">
            <label for="nivel" class="block font-semibold mb-1">Nível</label>
            <input type="number" id="nivel" min="1" placeholder="Nível"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded">
        </div>
    </div>


    <!-- Atributos -->
    <div class="mb-3">
        <h2 class="text-xl font-semibold border-b border-gray-300 pb-2 mb-3">Atributos</h2>
        <div class="grid lg:grid-cols-6 gap-4">
            <div>
                <label class="block font-semibold mb-1">Força</label>
                <input type="number" min="1" max="20" placeholder="STR"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
            <div>
                <label class="block font-semibold mb-1">Destreza</label>
                <input type="number" min="1" max="20" placeholder="DEX"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
            <div>
                <label class="block font-semibold mb-1">Constituição</label>
                <input type="number" min="1" max="20" placeholder="CON"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
            <div>
                <label class="block font-semibold mb-1">Inteligência</label>
                <input type="number" min="1" max="20" placeholder="INT"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
            <div>
                <label class="block font-semibold mb-1">Sabedoria</label>
                <input type="number" min="1" max="20" placeholder="WIS"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
            <div>
                <label class="block font-semibold mb-1">Carisma</label>
                <input type="number" min="1" max="20" placeholder="CHA"
                    class="w-full p-2 border border-gray-300 bg-zinc-800 rounded text-center">
            </div>
        </div>
    </div>

    <!-- Defesa e Vida -->
    <div class="mb-3">
        <h2 class="text-xl font-semibold border-b border-gray-300 pb-2 mb-3">Defesa</h2>
        <div class="grid grid-cols-2 gap-4 mb-3">
            <div>
                <label for="armorClass" class="block font-semibold mb-1">Classe de Armadura (CA)</label>
                <input type="number" id="armorClass" min="1" placeholder="CA"
                    class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
            </div>
            <div>
                <label for="speed" class="block font-semibold mb-1">Deslocamento</label>
                <input type="number" id="speed" min="1" placeholder="Speed"
                    class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
            </div>

        </div>
        <div class="grid grid-rows-1 grid-flow-col gap-4">
            <div>
                <label for="currentLife" class="block font-semibold mb-1">Vida Atual</label>
                <input type="number" id="currentLife" min="0" placeholder="Vida Atual"
                    class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
            </div>
            <div>
                <label for="maxLife" class="block font-semibold mb-1">Vida Máxima</label>
                <input type="number" id="maxLife" min="1" placeholder="Vida Máxima"
                    class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
            </div>
            <div>
                <label for="tempLife" class="block font-semibold mb-1">Vida Temporária</label>
                <input type="number" id="tempLife" min="0" placeholder="Vida Temporária"
                    class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
            </div>
        </div>
    </div>

    <!-- Outras Habilidades -->
    <div class="grid grid-cols-3 gap-4 mb-3">
        <div>
            <label for="iniciative" class="block font-semibold mb-1">Iniciativa</label>
            <input type="number" id="iniciative" placeholder="Iniciativa"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center mb-3">
        </div>
        <div>
            <label for="proficiency" class="block font-semibold mb-1">Bônus de Proficiência</label>
            <input type="number" id="proficiency" placeholder="Proficiência"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center mb-3">
        </div>
        <div>
            <label for="perception" class="block font-semibold mb-1">Percepção Passiva</label>
            <input type="number" id="perception" placeholder="Percepção"
                class="w-full p-2 bg-zinc-800 border border-gray-300 rounded text-center">
        </div>
    </div>

    <!-- Perícias -->
    <div class="mb-3">
        <h2 class="text-xl font-semibold border-b border-gray-300 pb-2 mb-3">Perícias</h2>
        <textarea id="skills" rows="4" class="w-full p-2 bg-zinc-800 border border-gray-300 rounded"
            placeholder="Ex: Furtividade +6, Acrobacia +4, etc."></textarea>
    </div>

    <!-- Equipamentos e Anotações -->
    <div class="mb-3">
        <h2 class="text-xl font-semibold border-b border-gray-300 pb-2 mb-3">Equipamentos e Anotações</h2>
        <textarea id="equipment" rows="4" class="w-full bg-zinc-800 p-2 border border-gray-300 rounded"
            placeholder="Anote seus equipamentos aqui."></textarea>
    </div>
</div>
